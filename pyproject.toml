[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiadian"
version = "0.1.0"
description = "家电 · 报修诊断 · 故障树自查、保修判断、修还是换"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
jiadian = "jiadian.cli:main"

[tool.setuptools]
packages = ["jiadian"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
